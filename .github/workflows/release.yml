name: Portable desktop artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Add both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: apps/desktop
      - name: Set build identity and numeric bundle version
        run: node scripts/build-info.mjs
      - run: npm test
        working-directory: apps/desktop
      - name: Cache verified ffmpeg sources and sidecars
        uses: actions/cache@v4
        with:
          path: |
            target/ffmpeg-cache
            apps/desktop/src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs', 'scripts/ffmpeg-sources.json') }}
      - name: Prepare LGPL ffmpeg sidecar
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            node scripts/fetch-ffmpeg.mjs --target universal-apple-darwin
          else
            node scripts/fetch-ffmpeg.mjs --target x86_64-pc-windows-msvc
          fi
      - name: Test the whole core suite with native bundled codecs
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export MOBBOSS_FFMPEG="$PWD/apps/desktop/src-tauri/binaries/ffmpeg-universal-apple-darwin"
          else
            export MOBBOSS_FFMPEG="$(cygpath -w "$PWD/apps/desktop/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe")"
          fi
          export MOBBOSS_REQUIRE_CODEC_SMOKE=1
          # Includes all unit/integration/doc tests, planners, transfers and codec gates.
          cargo test -p mobboss-core --all-targets -- --nocapture
          cargo test -p mobboss-core --doc
      - name: Build ad-hoc signed universal Mac app and disk image
        if: runner.os == 'macOS'
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg
        working-directory: apps/desktop
      - name: Verify Mac app and bundled ffmpeg signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='target/universal-apple-darwin/release/bundle/macos/Mob Boss.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/ffmpeg"
          codesign -dv --verbose=2 "$app/Contents/MacOS/ffmpeg"
      - name: Build portable Windows executable
        if: runner.os == 'Windows'
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --no-bundle
        working-directory: apps/desktop
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
      - name: Archive app bundle preserving permissions and symlinks
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'target/universal-apple-darwin/release/bundle/macos/Mob Boss.app' 'target/MobBoss-macOS-universal.app.zip'
      - name: Stage portable Windows zip contents and report sizes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = 'target/MobBoss-Windows-portable'
          New-Item -ItemType Directory -Path "$stage/licenses" -Force | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/MobBoss.exe' "$stage/MobBoss.exe"
          Copy-Item 'apps/desktop/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe' "$stage/ffmpeg.exe"
          Copy-Item 'THIRD-PARTY-NOTICES.md' "$stage/THIRD-PARTY-NOTICES.md"
          Copy-Item 'docs/licenses/*' "$stage/licenses/"
          Copy-Item 'apps/desktop/src-tauri/binaries/FFmpeg-Windows-LICENSE.txt' "$stage/licenses/"
          Get-ChildItem "$stage/*.exe" | Select-Object Name,Length | Format-Table
          "### Windows bundle sizes (bytes)" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem "$stage/*.exe" | ForEach-Object { "- $($_.Name): $($_.Length)" >> $env:GITHUB_STEP_SUMMARY }
      - name: Report macOS bundle sizes
        if: runner.os == 'macOS'
        shell: bash
        run: |
          du -sk 'target/universal-apple-darwin/release/bundle/macos/Mob Boss.app'
          stat -f '%N: %z bytes' target/MobBoss-macOS-universal.app.zip target/universal-apple-darwin/release/bundle/dmg/*.dmg apps/desktop/src-tauri/binaries/ffmpeg-universal-apple-darwin
          {
            echo '### macOS bundle sizes'
            du -sk 'target/universal-apple-darwin/release/bundle/macos/Mob Boss.app'
            stat -f '%N: %z bytes' target/MobBoss-macOS-universal.app.zip target/universal-apple-darwin/release/bundle/dmg/*.dmg apps/desktop/src-tauri/binaries/ffmpeg-universal-apple-darwin
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: MobBoss-macOS-universal-adhoc
          path: |
            target/MobBoss-macOS-universal.app.zip
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        id: windows_portable
        if: runner.os == 'Windows'
        with:
          name: MobBoss-Windows-portable
          # upload-artifact produces the portable ZIP directly: no nested archive.
          path: target/MobBoss-Windows-portable/
          compression-level: 6
          if-no-files-found: error
          retention-days: 7
      - name: Report actual portable ZIP size
        continue-on-error: true
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            const artifact = await github.rest.actions.getArtifact({
              ...context.repo,
              artifact_id: Number('${{ steps.windows_portable.outputs.artifact-id }}')
            });
            const size = artifact.data.size_in_bytes;
            await core.summary.addRaw(`Portable Windows ZIP: ${size} bytes`).write();
            if (size > 60_000_000) {
              core.warning('Portable Windows ZIP exceeds 60 MB; report size for minimal-build review.');
              await core.summary.addRaw(' — Above 60 MB: consider a minimal Windows ffmpeg build in a later round.').write();
            }
