[package]
name = "mobboss-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "mobboss_desktop"
[[bin]]
name = "MobBoss"
path = "src/main.rs"
required-features = ["desktop"]
[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
[dependencies]
mobboss-core = { path = "../../../crates/mobboss-core" }
base64 = "0.22"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
tauri = { version = "2", optional = true , features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2", optional = true }
[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
